<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Grade Recovery & Simulation Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-blue-400">CGPA Recovery Matrix</h1>
            <p class="text-slate-400 text-sm mt-1">Simulate your semester grades and project your final CGPA instantly (5.0 Scale).</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Left: Previous Standing & Controls -->
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 md:col-span-1 space-y-4">
                <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2">1. Current Standing</h2>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Total Units So Far (TUM)</label>
                    <input type="number" id="prevUnits" value="45" oninput="calculateCGPA()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Current CGPA</label>
                    <input type="number" step="0.01" id="prevCGPA" value="3.80" oninput="calculateCGPA()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="pt-4 border-t border-slate-700">
                    <button onclick="addCourseRow()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition">+ Add Semester Course</button>
                </div>
            </div>

            <!-- Right: Current Semester Courses & Result Dashboard -->
            <div class="md:col-span-2 space-y-6">
                <!-- Result Card -->
                <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-6 rounded-xl shadow-lg border border-blue-700 flex justify-between items-center">
                    <div>
                        <p class="text-xs uppercase tracking-wider text-blue-300 font-semibold">Projected Final CGPA</p>
                        <h2 id="finalCGPA" class="text-4xl font-extrabold text-white mt-1">4.12</h2>
                    </div>
                    <div class="text-right">
                        <p class="text-xs uppercase tracking-wider text-blue-300 font-semibold">Class of Degree</p>
                        <p id="degreeClass" class="text-lg font-bold text-emerald-400 mt-1">2nd Class Upper</p>
                    </div>
                </div>

                <!-- Courses List -->
                <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
                    <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2 mb-4">2. Current Semester Courses</h2>
                    
                    <div id="coursesContainer" class="space-y-3">
                        <!-- Initial Row -->
                        <div class="course-row grid grid-cols-12 gap-2 items-center bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="col-span-5">
                                <input type="text" placeholder="Course Code (e.g. CSC301)" class="course-name w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white">
                            </div>
                            <div class="col-span-3">
                                <input type="number" placeholder="Units" value="3" min="1" max="6" oninput="calculateCGPA()" class="course-units w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white">
                            </div>
                            <div class="col-span-3">
                                <select onchange="calculateCGPA()" class="course-grade w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white">
                                    <option value="5">A (5)</option>
                                    <option value="4" selected>B (4)</option>
                                    <option value="3">C (3)</option>
                                    <option value="2">D (2)</option>
                                    <option value="1">E (1)</option>
                                    <option value="0">F (0)</option>
                                </select>
                            </div>
                            <div class="col-span-1 text-center">
                                <button onclick="removeCourseRow(this)" class="text-rose-400 hover:text-rose-300 font-bold text-sm">✕</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addCourseRow() {
            const container = document.getElementById('coursesContainer');
            const row = document.createElement('div');
            row.className = 'course-row grid grid-cols-12 gap-2 items-center bg-slate-900/50 p-3 rounded-lg border border-slate-700/50';
            row.innerHTML = `
                <div class="col-span-5">
                    <input type="text" placeholder="Course Code" class="course-name w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white">
                </div>
                <div class="col-span-3">
                    <input type="number" placeholder="Units" value="3" min="1" max="6" oninput="calculateCGPA()" class="course-units w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white">
                </div>
                <div class="col-span-3">
                    <select onchange="calculateCGPA()" class="course-grade w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white">
                        <option value="5">A (5)</option>
                        <option value="4">B (4)</option>
                        <option value="3">C (3)</option>
                        <option value="2">D (2)</option>
                        <option value="1">E (1)</option>
                        <option value="0">F (0)</option>
                    </select>
                </div>
                <div class="col-span-1 text-center">
                    <button onclick="removeCourseRow(this)" class="text-rose-400 hover:text-rose-300 font-bold text-sm">✕</button>
                </div>
            `;
            container.appendChild(row);
            calculateCGPA();
        }

        function removeCourseRow(btn) {
            btn.closest('.course-row').remove();
            calculateCGPA();
        }

        function calculateCGPA() {
            const prevUnits = parseFloat(document.getElementById('prevUnits').value) || 0;
            const prevCGPA = parseFloat(document.getElementById('prevCGPA').value) || 0;
            
            let totalPreviousPoints = prevUnits * prevCGPA;
            
            let semesterUnits = 0;
            let semesterPoints = 0;

            const rows = document.querySelectorAll('.course-row');
            rows.forEach(row => {
                const units = parseFloat(row.querySelector('.course-units').value) || 0;
                const gradePoint = parseFloat(row.querySelector('.course-grade').value) || 0;
                
                semesterUnits += units;
                semesterPoints += (units * gradePoint);
            });

            const grandTotalUnits = prevUnits + semesterUnits;
            const grandTotalPoints = totalPreviousPoints + semesterPoints;

            let finalCGPA = 0.00;
            if (grandTotalUnits > 0) {
                finalCGPA = grandTotalPoints / grandTotalUnits;
            }

            document.getElementById('finalCGPA').innerText = finalCGPA.toFixed(2);

            // Determine Degree Class
            const degreeElem = document.getElementById('degreeClass');
            if (finalCGPA >= 4.50) {
                degreeElem.innerText = "First Class 🌟";
                degreeElem.className = "text-lg font-bold text-amber-400 mt-1";
            } else if (finalCGPA >= 3.50) {
                degreeElem.innerText = "2nd Class Upper 🚀";
                degreeElem.className = "text-lg font-bold text-emerald-400 mt-1";
            } else if (finalCGPA >= 2.40) {
                degreeElem.innerText = "2nd Class Lower 📚";
                degreeElem.className = "text-lg font-bold text-blue-400 mt-1";
            } else if (finalCGPA >= 1.50) {
                degreeElem.innerText = "Third Class ⚠️";
                degreeElem.className = "text-lg font-bold text-yellow-400 mt-1";
            } else {
                degreeElem.innerText = "Pass / Warning 🛑";
                degreeElem.className = "text-lg font-bold text-rose-400 mt-1";
            }
        }

        // Run initial calculation on load
        calculateCGPA();
    </script>
</body>
</html>
