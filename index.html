<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Grade Recovery & Simulation Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-blue-400">CGPA Recovery Matrix</h1>
            <p class="text-slate-400 text-sm mt-1">Simulate your semester grades, set target goals, and project your final CGPA instantly (5.0 Scale).</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Left: Previous Standing & Goals -->
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 md:col-span-1 space-y-4">
                <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2">1. Current Standing</h2>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Total Units So Far (TUM)</label>
                    <input type="number" id="prevUnits" value="45" oninput="saveAndCalculate()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Current CGPA</label>
                    <input type="number" step="0.01" id="prevCGPA" value="3.80" oninput="saveAndCalculate()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-blue-400 mb-1">Target CGPA Goal 🎯</label>
                    <input type="number" step="0.01" id="targetCGPA" value="4.50" oninput="saveAndCalculate()" class="w-full bg-slate-900 border border-blue-500/50 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-400">
                </div>

                <div class="pt-4 border-t border-slate-700">
                    <button onclick="addCourseRow()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition">+ Add Semester Course</button>
                </div>
            </div>

            <!-- Right: Result Dashboard & Courses List -->
            <div class="md:col-span-2 space-y-6">
                <!-- Result Card -->
                <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-6 rounded-xl shadow-lg border border-blue-700 grid grid-cols-2 gap-4 items-center">
                    <div>
                        <p class="text-xs uppercase tracking-wider text-blue-300 font-semibold">Projected Final CGPA</p>
                        <h2 id="finalCGPA" class="text-4xl font-extrabold text-white mt-1">4.12</h2>
                        <p id="degreeClass" class="text-sm font-bold text-emerald-400 mt-1">2nd Class Upper</p>
                    </div>
                    <div class="bg-slate-900/40 p-3 rounded-lg border border-blue-500/30 text-right">
                        <p class="text-xs uppercase tracking-wider text-slate-300 font-semibold">Goal Status</p>
                        <p id="goalStatus" class="text-sm font-bold text-amber-400 mt-1">Calculating...</p>
                    </div>
                </div>

                <!-- Courses List -->
                <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
                        <h2 class="text-lg font-bold text-slate-200">2. Current Semester Courses</h2>
                        <span id="semesterSummary" class="text-xs text-slate-400">0 Units | 0 Courses</span>
                    </div>
                    
                    <div id="coursesContainer" class="space-y-3">
                        <!-- Initial Row -->
                        <div class="course-row grid grid-cols-12 gap-2 items-center bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="col-span-5">
                                <input type="text" placeholder="Course Code (e.g. CSC301)" value="CSC301" class="course-name w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white" oninput="saveAndCalculate()">
                            </div>
                            <div class="col-span-3">
                                <input type="number" placeholder="Units" value="3" min="1" max="6" oninput="saveAndCalculate()" class="course-units w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white">
                            </div>
                            <div class="col-span-3">
                                <select onchange="saveAndCalculate()" class="course-grade w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white">
                                    <option value="5">A (5)</option>
                                    <option value="4" selected>B (4)</option>
                                    <option value="3">C (3)</option>
                                    <option value="2">D (2)</option>
                                    <option value="1">E (1)</option>
                                    <option value="0">F (0)</option>
                                </select>
                            </div>
                            <div class="col-span-1 text-center">
                                <button onclick="removeCourseRow(this)" class="text-rose-400 hover:text-rose-300 font-bold text-sm">✕</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load saved data on startup
        window.onload = function() {
            const savedData = localStorage.getItem('cgpaData');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('prevUnits').value = data.prevUnits || '';
                document.getElementById('prevCGPA').value = data.prevCGPA || '';
                document.getElementById('targetCGPA').value = data.targetCGPA || '';
                
                if (data.courses && data.courses.length > 0) {
                    const container = document.getElementById('coursesContainer');
                    container.innerHTML = '';
                    data.courses.forEach(c => {
                        appendCourseRow(c.name, c.units, c.grade);
                    });
                }
            }
            calculateCGPA();
        };

        function addCourseRow() {
            appendCourseRow('', '3', '5');
            saveAndCalculate();
        }

        function appendCourseRow(name, units, grade) {
            const container = document.getElementById('coursesContainer');
            const row = document.createElement('div');
            row.className = 'course-row grid grid-cols-12 gap-2 items-center bg-slate-900/50 p-3 rounded-lg border border-slate-700/50';
            row.innerHTML = `
                <div class="col-span-5">
                    <input type="text" placeholder="Course Code" value="${name}" class="course-name w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white" oninput="saveAndCalculate()">
                </div>
                <div class="col-span-3">
                    <input type="number" placeholder="Units" value="${units}" min="1" max="6" oninput="saveAndCalculate()" class="course-units w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white">
                </div>
                <div class="col-span-3">
                    <select onchange="saveAndCalculate()" class="course-grade w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white">
                        <option value="5" ${grade == '5' ? 'selected' : ''}>A (5)</option>
                        <option value="4" ${grade == '4' ? 'selected' : ''}>B (4)</option>
                        <option value="3" ${grade == '3' ? 'selected' : ''}>C (3)</option>
                        <option value="2" ${grade == '2' ? 'selected' : ''}>D (2)</option>
                        <option value="1" ${grade == '1' ? 'selected' : ''}>E (1)</option>
                        <option value="0" ${grade == '0' ? 'selected' : ''}>F (0)</option>
                    </select>
                </div>
                <div class="col-span-1 text-center">
                    <button onclick="removeCourseRow(this)" class="text-rose-400 hover:text-rose-300 font-bold text-sm">✕</button>
                </div>
            `;
            container.appendChild(row);
        }

        function removeCourseRow(btn) {
            btn.closest('.course-row').remove();
            saveAndCalculate();
        }

        function saveAndCalculate() {
            // Save state to local storage
            const prevUnits = document.getElementById('prevUnits').value;
            const prevCGPA = document.getElementById('prevCGPA').value;
            const targetCGPA = document.getElementById('targetCGPA').value;
            
            const courses = [];
            document.querySelectorAll('.course-row').forEach(row => {
                courses.push({
                    name: row.querySelector('.course-name').value,
                    units: row.querySelector('.course-units').value,
                    grade: row.querySelector('.course-grade').value
                });
            });

            localStorage.setItem('cgpaData', JSON.stringify({ prevUnits, prevCGPA, targetCGPA, courses }));
            calculateCGPA();
        }

        function calculateCGPA() {
            const prevUnits = parseFloat(document.getElementById('prevUnits').value) || 0;
            const prevCGPA = parseFloat(document.getElementById('prevCGPA').value) || 0;
            const targetCGPA = parseFloat(document.getElementById('targetCGPA').value) || 0;
            
            let totalPreviousPoints = prevUnits * prevCGPA;
            
            let semesterUnits = 0;
            let semesterPoints = 0;
            let courseCount = 0;

            const rows = document.querySelectorAll('.course-row');
            rows.forEach(row => {
                const units = parseFloat(row.querySelector('.course-units').value) || 0;
                const gradePoint = parseFloat(row.querySelector('.course-grade').value) || 0;
                
                semesterUnits += units;
                semesterPoints += (units * gradePoint);
                courseCount++;
            });

            document.getElementById('semesterSummary').innerText = `${semesterUnits} Units | ${courseCount} Courses`;

            const grandTotalUnits = prevUnits + semesterUnits;
            const grandTotalPoints = totalPreviousPoints + semesterPoints;

            let finalCGPA = 0.00;
            if (grandTotalUnits > 0) {
                finalCGPA = grandTotalPoints / grandTotalUnits;
            }

            document.getElementById('finalCGPA').innerText = finalCGPA.toFixed(2);

            // Determine Degree Class
            const degreeElem = document.getElementById('degreeClass');
            if (finalCGPA >= 4.50) {
                degreeElem.innerText = "First Class 🌟";
                degreeElem.className = "text-sm font-bold text-amber-400 mt-1";
            } else if (finalCGPA >= 3.50) {
                degreeElem.innerText = "2nd Class Upper 🚀";
                degreeElem.className = "text-sm font-bold text-emerald-400 mt-1";
            } else if (finalCGPA >= 2.40) {
                degreeElem.innerText = "2nd Class Lower 📚";
                degreeElem.className = "text-sm font-bold text-blue-400 mt-1";
            } else if (finalCGPA >= 1.50) {
                degreeElem.innerText = "Third Class ⚠️";
                degreeElem.className = "text-sm font-bold text-yellow-400 mt-1";
            } else {
                degreeElem.innerText = "Pass / Warning 🛑";
                degreeElem.className = "text-sm font-bold text-rose-400 mt-1";
            }

            // Goal Tracker Status
            const goalElem = document.getElementById('goalStatus');
            if (targetCGPA > 0) {
                if (finalCGPA >= targetCGPA) {
                    goalElem.innerText = "Target Achieved! 🎉";
                    goalElem.className = "text-sm font-bold text-emerald-400 mt-1";
                } else {
                    const diff = (targetCGPA - finalCGPA).toFixed(2);
                    goalElem.innerText = `Need +${diff} more points`;
                    goalElem.className = "text-sm font-bold text-amber-400 mt-1";
                }
            } else {
                goalElem.innerText = "Set a target goal";
                goalElem.className = "text-sm font-bold text-slate-400 mt-1";
            }
        }
    </script>
</body>
</html>
